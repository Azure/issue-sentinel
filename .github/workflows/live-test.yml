name: Live Test (Azure CLI PR)
run-name: Live Test (PR ${{ inputs.pr_number }} @ ${{ inputs.pr_head_sha || 'auto' }})

# Triggered remotely by the Azure Client Tools Agent Tester via:
#   POST /repos/Azure/issue-sentinel/actions/workflows/live-test.yml/dispatches
#
# Runs `azdev test {module} --live --series` against an in-flight PR on
# Azure/azure-cli using BAMI-tenant credentials (federated via OIDC), and
# posts the result back as a PR comment.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number on Azure/azure-cli"
        required: true
        type: string
      module:
        description: "Optional advisory module/extension name (no longer used for selection; tests are derived from changed test files). Kept for backward compatibility."
        required: false
        type: string
        default: ""
      target_kind:
        description: "Whether the PR targets a core module or an azure-cli-extensions extension (used only to decide azdev setup flags)."
        required: false
        type: choice
        options:
          - module
          - extension
        default: module
      repo:
        description: "owner/repo of the PR (Azure/azure-cli or Azure/azure-cli-extensions)"
        required: false
        type: string
        default: "Azure/azure-cli"
      pr_head_sha:
        description: "PR head SHA observed by dispatcher (optional, for dedupe/traceability)"
        required: false
        type: string
        default: ""
      post_comment:
        description: "Post result back to the PR as a comment"
        required: false
        type: boolean
        default: true
      commit_recordings:
        description: "Commit verified live-test recordings back to eligible PR head branches"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write       # required for federated OIDC login to BAMI
  contents: read
  pull-requests: write  # required to comment back on the PR

concurrency:
  group: live-test-${{ inputs.repo }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  live-test:
    name: azdev test --live (PR ${{ inputs.pr_number }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      agent_candidate: ${{ steps.pr.outputs.agent_candidate }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      recording_count: ${{ steps.rec.outputs.count }}
      test_exit_code: ${{ steps.test.outputs.exit_code }}
      playback_exit_code: ${{ steps.playback.outputs.exit_code }}

    env:
      PR_REPO: ${{ inputs.repo }}
      PR_NUMBER: ${{ inputs.pr_number }}

    steps:
      - name: Azure login (SDK Infrastructure, federated OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURESDK_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURESDK_TENANT_ID }}
          subscription-id: ${{ secrets.AZURESDK_SUBSCRIPTION_ID }}

      - name: Fetch PAT from Key Vault
        id: kv
        run: |
          set -euo pipefail
          pat=$(az keyvault secret show \
            --vault-name azclibotfinegrainedpat \
            --name azclibot-pat \
            --query value -o tsv)
          echo "::add-mask::${pat}"
          echo "pat=${pat}" >> "$GITHUB_OUTPUT"

      - name: Azure login (BAMI tenant, federated OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.BAMI_CLIENT_ID }}
          tenant-id:       ${{ secrets.BAMI_TENANT_ID }}
          subscription-id: ${{ secrets.BAMI_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false

      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ steps.kv.outputs.pat }}
          DISPATCHED_HEAD_SHA: ${{ inputs.pr_head_sha }}
        run: |
          set -euo pipefail
          case "$PR_REPO" in
            Azure/azure-cli|Azure/azure-cli-extensions) ;;
            *)
              echo "::error::Unsupported pull request repository."
              exit 1
              ;;
          esac
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid pull request number."
            exit 1
          fi
          owner="${PR_REPO%/*}"
          repo="${PR_REPO#*/}"
          pr_json=$(gh api "repos/${owner}/${repo}/pulls/${PR_NUMBER}")
          head_sha=$(echo "$pr_json" | jq -r .head.sha)
          head_ref=$(echo "$pr_json" | jq -r .head.ref)
          base_ref=$(echo "$pr_json" | jq -r .base.ref)
          head_repo=$(echo "$pr_json" | jq -r .head.repo.full_name)
          head_owner=$(echo "$pr_json" | jq -r .head.repo.owner.login)
          pr_author=$(echo "$pr_json" | jq -r .user.login)
          has_job_marker=$(echo "$pr_json" | jq -r \
            '(.body // "") | test("<!-- agent-assist:foundry-job [a-f0-9]{64} -->")')
          agent_candidate=false
          if [ "$head_repo" != "$PR_REPO" ] \
              && [ "$head_owner" = "$pr_author" ] \
              && [[ "$head_ref" == agent-assist/* ]] \
              && [ "$has_job_marker" = "true" ]; then
            agent_candidate=true
          fi
          if [ -n "$DISPATCHED_HEAD_SHA" ] \
              && [ "$head_sha" != "$DISPATCHED_HEAD_SHA" ]; then
            echo "::error::PR head changed after dispatch."
            exit 1
          fi
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${head_ref}" >> "$GITHUB_OUTPUT"
          echo "base_ref=${base_ref}" >> "$GITHUB_OUTPUT"
          echo "head_repo=${head_repo}" >> "$GITHUB_OUTPUT"
          echo "agent_candidate=${agent_candidate}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}"       >> "$GITHUB_OUTPUT"
          echo "repo=${repo}"         >> "$GITHUB_OUTPUT"

      - name: Log resolved PR refs
        run: |
          set -euo pipefail
          echo "Resolved PR target: ${{ steps.pr.outputs.owner }}/${{ steps.pr.outputs.repo }}#${{ inputs.pr_number }}"
          echo "PR head ref: ${{ steps.pr.outputs.head_ref }}"
          echo "PR head sha: ${{ steps.pr.outputs.head_sha }}"
          echo "PR base ref: ${{ steps.pr.outputs.base_ref }}"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.owner }}/${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          path: ${{ steps.pr.outputs.repo }}

      - name: Checkout companion repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repo == 'azure-cli' && 'Azure/azure-cli-extensions' || 'Azure/azure-cli' }}
          ref: ${{ steps.pr.outputs.repo == 'azure-cli' && 'main' || 'dev' }}
          fetch-depth: 1
          path: ${{ steps.pr.outputs.repo == 'azure-cli' && 'azure-cli-extensions' || 'azure-cli' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Checkout live-test workflow tools
        uses: actions/checkout@v4
        with:
          repository: Azure/issue-sentinel
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: issue-sentinel-workflow

      - name: Resolve changed test files
        id: detect
        env:
          PR_REPO_NAME: ${{ steps.pr.outputs.repo }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          cd "$PR_REPO_NAME"
          git fetch origin "${BASE_REF}" --depth=200 || true

          # Only command-module and extension tests are valid azdev live-test
          # targets. Core-package and other nested tests use different runners.
          changed=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" || true)
          if [ "$PR_REPO_NAME" = "azure-cli-extensions" ]; then
            test_pattern='^src/[^/]+/azext_[^/]+/tests/latest/test_[^/]*\.py$'
          else
            test_pattern='^src/azure-cli/azure/cli/command_modules/[^/]+/tests/latest/test_[^/]*\.py$'
          fi
          test_files=$(echo "$changed" | grep -E "$test_pattern" || true)

          # Only files that still exist on the PR head (a renamed-away path won't).
          existing=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] && existing="${existing}${f}"$'\n'
          done <<< "$test_files"
          test_files="$existing"

          # Select changed test methods/classes. Fall back to the file when shared
          # fixtures or helpers changed, so unrelated tests do not block the PR.
          mkdir -p ../test-output
          set +e
          stems=$(printf '%s\n' "$test_files" \
            | python ../issue-sentinel-workflow/.github/scripts/changed_python_tests.py \
                --base "origin/${BASE_REF}" \
                --manifest ../test-selection.json \
                2>../test-output/selection-error.log)
          selector_rc=$?
          set -e

          # Newly-added test files (for reporting).
          new_files=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" \
            | grep -E "$test_pattern" || true)

          # Decide azdev setup flags. Extensions must be installed by name so azdev
          # can discover their tests; core modules are all available after a plain setup.
          if [ "$PR_REPO_NAME" = "azure-cli-extensions" ]; then
            kind="extension"
            extensions=$(echo "$test_files" \
              | awk -F/ '$1=="src"{print $2}' \
              | sort -u \
              | paste -sd ' ' -)
          else
            kind="module"
            extensions=""
          fi

          if [ "$selector_rc" != "0" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "selection_error=true" >> "$GITHUB_OUTPUT"
            echo "::error::Changed tests could not be selected safely."
            cat ../test-output/selection-error.log
          elif [ -z "$stems" ]; then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "selection_error=false" >> "$GITHUB_OUTPUT"
            echo "No changed test files detected — nothing to live-test."
          else
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "selection_error=false" >> "$GITHUB_OUTPUT"
            echo "Changed test files:"
            echo "$test_files"
            echo "Selectors: $stems"
          fi
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"
          echo "extensions=${extensions}" >> "$GITHUB_OUTPUT"
          echo "stems=${stems}" >> "$GITHUB_OUTPUT"
          if [ -n "$new_files" ]; then
            echo "has_new_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new_tests=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "new_list<<EOF"
            echo "$new_files"
            echo "EOF"
            echo "files_list<<EOF"
            echo "$test_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install azdev and Azure CLI from source
        if: >-
          steps.detect.outputs.has_tests == 'true'
          && steps.detect.outputs.selection_error != 'true'
        env:
          KIND: ${{ steps.detect.outputs.kind }}
          EXTENSIONS: ${{ steps.detect.outputs.extensions }}
        run: |
          set -euo pipefail
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install azdev
          if [ "$KIND" = "extension" ] && [ -n "$EXTENSIONS" ]; then
            read -r -a extensions <<< "$EXTENSIONS"
            azdev setup -c azure-cli -r azure-cli-extensions -e "${extensions[@]}"
          else
            azdev setup -c azure-cli
          fi

      - name: Run azdev test (live, series) — changed tests only
        id: test
        if: >-
          steps.detect.outputs.has_tests == 'true'
          && steps.detect.outputs.selection_error != 'true'
        env:
          STEMS: ${{ steps.detect.outputs.stems }}
          KIND: ${{ steps.detect.outputs.kind }}
        run: |
          source .venv/bin/activate
          set -o pipefail
          mkdir -p test-output
          cp test-selection.json test-output/
          set +e
          python issue-sentinel-workflow/.github/scripts/changed_python_tests.py \
            --validate-manifest test-selection.json \
            2>&1 | tee test-output/selection.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            echo "ran_tests=false" >> "$GITHUB_OUTPUT"
            echo "validation_error=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "validation_error=false" >> "$GITHUB_OUTPUT"
          # Use the freshly generated and path-validated discovery index.
          set +e
          azdev test $STEMS --live --series \
            --xml-path test-output/results.xml \
            2>&1 | tee test-output/log.txt
          rc=$?
          set -e
          if grep -q "not found. If newly added, re-run with --discover" test-output/log.txt; then
            echo "::error::At least one changed-test selector did not resolve."
            rc=2
          fi
          ran=true
          if [ ! -s test-output/results.xml ] || ! grep -q '<testcase' test-output/results.xml; then
            ran=false
            if [ "$rc" = "0" ]; then
              echo "::error::azdev selected 0 tests from changed files [$STEMS] — discovery may have failed (new file not indexed, or extension not installed)."
              rc=2
            fi
          fi
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          echo "ran_tests=${ran}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect live-test recordings
        id: rec
        if: >-
          always()
          && steps.detect.outputs.has_tests == 'true'
          && steps.detect.outputs.selection_error != 'true'
        env:
          PR_REPO_NAME: ${{ steps.pr.outputs.repo }}
        run: |
          set -euo pipefail
          cd "$PR_REPO_NAME"
          mkdir -p ../test-output/recordings
          # `azdev test --live` regenerates VCR cassettes in place under
          # **/tests/**/recordings/*.yaml. Capture the ones this run changed
          # (modified or newly added) so they can be archived and pushed.
          changed=$(git status --porcelain \
            | awk '{print $2}' \
            | grep -E '/recordings/.*\.yaml$' || true)
          count=0
          if [ -n "$changed" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              dest="../test-output/recordings/${f}"
              mkdir -p "$(dirname "$dest")"
              cp "$f" "$dest"
              count=$((count + 1))
            done <<< "$changed"
          fi
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Collected ${count} changed recording file(s) into test-output/recordings/."

      - name: Verify recordings replay (playback, no --live)
        id: playback
        if: >-
          always()
          && steps.detect.outputs.has_tests == 'true'
          && steps.rec.outputs.count != '0'
          && steps.test.outputs.exit_code == '0'
        env:
          STEMS: ${{ steps.detect.outputs.stems }}
        run: |
          source .venv/bin/activate
          set -o pipefail
          mkdir -p test-output
          rm -f test-output/playback-results.xml
          set +e
          # shellcheck disable=SC2086
          azdev test $STEMS --series \
            --xml-path test-output/playback-results.xml \
            2>&1 | tee test-output/playback-log.txt
          rc=$?
          set -e
          if grep -q "not found. If newly added, re-run with --discover" test-output/playback-log.txt; then
            echo "::error::At least one playback selector did not resolve."
            rc=2
          fi
          if [ ! -s test-output/playback-results.xml ] \
              || ! grep -q '<testcase' test-output/playback-results.xml; then
            if [ "$rc" = "0" ]; then
              echo "::error::Playback selected zero tests; recordings will not be committed."
              rc=2
            fi
          fi
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "0" ]; then
            echo "Playback verification passed."
          else
            echo "::warning::Playback verification failed (exit ${rc}); recordings will not be committed."
          fi
          exit 0

      - name: Commit recordings to PR branch
        id: push
        if: >-
          always()
          && steps.detect.outputs.has_tests == 'true'
          && inputs.commit_recordings == true
          && steps.rec.outputs.count != '0'
          && steps.test.outputs.exit_code == '0'
          && steps.playback.outputs.exit_code == '0'
          && steps.pr.outputs.head_repo == inputs.repo
        env:
          PR_REPO_NAME: ${{ steps.pr.outputs.repo }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          OWNER: ${{ steps.pr.outputs.owner }}
          REPO: ${{ steps.pr.outputs.repo }}
          PAT: ${{ steps.kv.outputs.pat }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$PR_REPO_NAME"
          files=$(git status --porcelain \
            | awk '{print $2}' \
            | grep -E '/recordings/.*\.yaml$' || true)
          if [ -z "$files" ]; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No recording changes to commit."
            exit 0
          fi
          git config user.name "azclibot"
          git config user.email "azclibot@users.noreply.github.com"
          echo "$files" | xargs git add --
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing staged after add."
            exit 0
          fi
          git commit -m "Update live-test recordings from azdev --live" \
            -m "Regenerated by the X Engineering Agent live-test workflow. Run: ${RUN_URL}" >/dev/null
          sha=$(git rev-parse HEAD)
          # Push with the azclibot token (installation token has contents:write).
          git remote set-url origin "https://x-access-token:${PAT}@github.com/${OWNER}/${REPO}.git"
          if git push origin "HEAD:${HEAD_REF}"; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${sha}" >> "$GITHUB_OUTPUT"
            echo "Pushed recordings commit ${sha} to ${OWNER}/${REPO}:${HEAD_REF}."
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Failed to push recordings to ${HEAD_REF} (branch may have moved or be protected)."
          fi

      - name: Upload test artifacts
        if: always() && steps.detect.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-test-pr-${{ inputs.pr_number }}
          path: test-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Build PR comment body
        if: always() && inputs.post_comment == true
        id: body
        env:
          HAS_TESTS: ${{ steps.detect.outputs.has_tests }}
          SELECTION_ERROR: ${{ steps.detect.outputs.selection_error }}
          VALIDATION_ERROR: ${{ steps.test.outputs.validation_error }}
          STEMS: ${{ steps.detect.outputs.stems }}
          KIND: ${{ steps.detect.outputs.kind }}
          EXIT_CODE: ${{ steps.test.outputs.exit_code }}
          RAN_TESTS: ${{ steps.test.outputs.ran_tests }}
          NEW_TESTS: ${{ steps.detect.outputs.has_new_tests }}
          NEW_TESTS_LIST: ${{ steps.detect.outputs.new_list }}
          CHANGED_TESTS_LIST: ${{ steps.detect.outputs.files_list }}
          PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          REC_COUNT: ${{ steps.rec.outputs.count }}
          REC_FILES: ${{ steps.rec.outputs.files }}
          REC_COMMITTED: ${{ steps.push.outputs.committed }}
          REC_COMMIT_SHA: ${{ steps.push.outputs.commit_sha }}
          PLAYBACK_EXIT: ${{ steps.playback.outputs.exit_code }}
          AGENT_CANDIDATE: ${{ steps.pr.outputs.agent_candidate }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${SELECTION_ERROR}" = "true" ] || [ "${VALIDATION_ERROR}" = "true" ]; then
            {
              echo "## Live test results — changed test files only"
              echo
              echo "❌ **FAIL** — changed tests could not be selected safely."
              echo
              echo "**PR head ref:** \`${PR_HEAD_REF}\`"
              echo "**PR head sha:** \`${PR_HEAD_SHA}\`"
              echo "**PR base ref:** \`${PR_BASE_REF}\`"
              echo
              echo "<details><summary>Selector error</summary>"
              echo
              echo '```'
              if [ "${SELECTION_ERROR}" = "true" ]; then
                cat test-output/selection-error.log 2>/dev/null || true
              else
                cat test-output/selection.log 2>/dev/null || true
              fi
              echo '```'
              echo
              echo "</details>"
              echo
              echo "**Workflow run:** ${RUN_URL}"
              echo
              echo "_Posted by the [X Engineering Agent](https://github.com/Azure/issue-sentinel/blob/main/.github/workflows/live-test.yml) live-test workflow._"
            } > comment.md
            echo "path=comment.md" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${HAS_TESTS}" != "true" ]; then
            {
              echo "## Live test results — changed test files only"
              echo
              echo "⏭️ **SKIPPED** — this PR changes no test files (\`tests/**/test_*.py\`), so there is nothing to live-test."
              echo
              echo "**PR head ref:** \`${PR_HEAD_REF}\`"
              echo "**PR head sha:** \`${PR_HEAD_SHA}\`"
              echo "**PR base ref:** \`${PR_BASE_REF}\`"
              echo
              echo "**Workflow run:** ${RUN_URL}"
              echo
              echo "_Posted by the [X Engineering Agent](https://github.com/Azure/issue-sentinel/blob/main/.github/workflows/live-test.yml) live-test workflow._"
            } > comment.md
            echo "path=comment.md" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${EXIT_CODE}" = "0" ]; then
            status="✅ **PASS**"
          elif [ "${RAN_TESTS}" = "false" ]; then
            status="⚠️ **NO TESTS SELECTED** — changed test files did not resolve to runnable tests"
          else
            status="❌ **FAIL** (exit ${EXIT_CODE})"
          fi
          tail_log=$(tail -n 80 test-output/log.txt 2>/dev/null \
            || tail -n 80 test-output/selection.log 2>/dev/null \
            || echo "(no log captured)")
          {
            echo "## Live test results — \`azdev test --live --series\` (changed test files only)"
            echo
            echo "${status}"
            echo
            echo "**Selectors:** \`${STEMS}\` (${KIND})"
            echo "**PR head ref:** \`${PR_HEAD_REF}\`"
            echo "**PR head sha:** \`${PR_HEAD_SHA}\`"
            echo "**PR base ref:** \`${PR_BASE_REF}\`"
            echo "**New test files in PR:** ${NEW_TESTS}"
            echo
            echo "<details><summary>Changed test files run</summary>"
            echo
            echo '```'
            echo "${CHANGED_TESTS_LIST}"
            echo '```'
            echo
            echo "</details>"
            if [ "${NEW_TESTS}" = "true" ]; then
              echo
              echo "<details><summary>New test files</summary>"
              echo
              echo '```'
              echo "${NEW_TESTS_LIST}"
              echo '```'
              echo
              echo "</details>"
            fi
            echo
            echo "**Workflow run:** ${RUN_URL}"
            if [ "${REC_COUNT:-0}" != "0" ]; then
              echo
              echo "**Live-test recordings:** ${REC_COUNT} regenerated — archived in workflow artifact \`live-test-pr-${PR_NUMBER}\` (\`recordings/\`)."
              if [ "${REC_COMMITTED}" = "true" ]; then
                echo "> ✅ Recorded live, verified in playback, and committed to \`${PR_HEAD_REF}\` as \`${REC_COMMIT_SHA}\` so CI playback uses the fresh recording."
              elif [ "${EXIT_CODE}" != "0" ]; then
                echo "> ⚠️ The recording was not committed because the live test failed. Fix the test failure before publishing its regenerated cassette."
              elif [ "${PLAYBACK_EXIT:-}" != "0" ] && [ -n "${PLAYBACK_EXIT:-}" ]; then
                echo "> ⚠️ The regenerated recording did not replay successfully, so it was not committed."
              elif [ "${HEAD_REPO}" != "${PR_REPO}" ] && [ "${AGENT_CANDIDATE}" = "true" ]; then
                echo "> ⏳ This agent-owned fork is eligible for automatic recording publication. The isolated trusted publisher job will verify and push it."
              elif [ "${HEAD_REPO}" != "${PR_REPO}" ]; then
                echo "> ℹ️ This PR is from a fork, so recordings were not pushed automatically. Download them from the artifact and commit to your branch."
              fi
              echo
              echo "<details><summary>Recording files</summary>"
              echo
              echo '```'
              echo "${REC_FILES}"
              echo '```'
              echo
              echo "</details>"
            fi
            echo
            echo "<details><summary>Last 80 lines of azdev output</summary>"
            echo
            echo '```'
            echo "${tail_log}"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "_Posted by the [X Engineering Agent](https://github.com/Azure/issue-sentinel/blob/main/.github/workflows/live-test.yml) live-test workflow._"
          } > comment.md
          echo "path=comment.md" >> "$GITHUB_OUTPUT"

      - name: Post comment back to PR
        if: always() && inputs.post_comment == true
        env:
          GH_TOKEN: ${{ steps.kv.outputs.pat }}
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${PR_REPO}/issues/${PR_NUMBER}/comments" \
            -F body=@${{ steps.body.outputs.path }} >/dev/null
          echo "Comment posted to ${PR_REPO}#${PR_NUMBER}"

      - name: Set workflow conclusion
        if: always()
        env:
          HAS_TESTS: ${{ steps.detect.outputs.has_tests }}
          SELECTION_ERROR: ${{ steps.detect.outputs.selection_error }}
          VALIDATION_ERROR: ${{ steps.test.outputs.validation_error }}
          EXIT_CODE: ${{ steps.test.outputs.exit_code }}
        run: |
          if [ "${SELECTION_ERROR}" = "true" ] || [ "${VALIDATION_ERROR}" = "true" ]; then
            echo "Changed tests could not be selected safely."
            exit 1
          fi
          if [ "${HAS_TESTS}" != "true" ]; then
            echo "No changed test files — skipping live test (neutral)."
            exit 0
          fi
          if [ "${EXIT_CODE}" = "0" ]; then
            echo "azdev tests passed."
            exit 0
          else
            echo "azdev tests failed (exit ${EXIT_CODE})."
            exit 1
          fi

  publish-agent-recordings:
    name: Publish verified recordings to agent fork
    needs: live-test
    if: >-
      always()
      && inputs.commit_recordings == true
      && needs.live-test.outputs.agent_candidate == 'true'
      && needs.live-test.outputs.head_repo != inputs.repo
      && needs.live-test.outputs.recording_count != '0'
      && needs.live-test.outputs.test_exit_code == '0'
      && needs.live-test.outputs.playback_exit_code == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_REPO: ${{ inputs.repo }}
      PR_NUMBER: ${{ inputs.pr_number }}

    steps:
      - name: Azure login (SDK Infrastructure, federated OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURESDK_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURESDK_TENANT_ID }}
          subscription-id: ${{ secrets.AZURESDK_SUBSCRIPTION_ID }}

      - name: Fetch isolated publication credentials
        id: kv
        run: |
          set -euo pipefail
          publish_token=$(az keyvault secret show \
            --vault-name azclibotfinegrainedpat \
            --name x-agent-publish-token \
            --query value -o tsv)
          bot_token=$(az keyvault secret show \
            --vault-name azclibotfinegrainedpat \
            --name x-engineering-agent-token \
            --query value -o tsv)
          echo "::add-mask::${publish_token}"
          echo "::add-mask::${bot_token}"
          echo "publish_token=${publish_token}" >> "$GITHUB_OUTPUT"
          echo "bot_token=${bot_token}" >> "$GITHUB_OUTPUT"

      - name: Verify agent-owned PR provenance
        id: verify
        env:
          GH_TOKEN: ${{ steps.kv.outputs.publish_token }}
          EXPECTED_HEAD_REPO: ${{ needs.live-test.outputs.head_repo }}
          EXPECTED_HEAD_REF: ${{ needs.live-test.outputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.live-test.outputs.head_sha }}
          DISPATCHED_HEAD_SHA: ${{ inputs.pr_head_sha }}
        run: |
          set -euo pipefail
          case "$PR_REPO" in
            Azure/azure-cli|Azure/azure-cli-extensions) ;;
            *)
              echo "::error::Unsupported pull request repository."
              exit 1
              ;;
          esac
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid pull request number."
            exit 1
          fi
          pr_json=$(gh api "repos/${PR_REPO}/pulls/${PR_NUMBER}")
          publisher=$(gh api user --jq .login)
          repo_name="${PR_REPO#*/}"
          expected_repo="${publisher}/${repo_name}"
          actual_repo=$(echo "$pr_json" | jq -r .head.repo.full_name)
          actual_ref=$(echo "$pr_json" | jq -r .head.ref)
          actual_sha=$(echo "$pr_json" | jq -r .head.sha)
          actual_author=$(echo "$pr_json" | jq -r .user.login)
          has_job_marker=$(echo "$pr_json" | jq -r \
            '(.body // "") | test("<!-- agent-assist:foundry-job [a-f0-9]{64} -->")')
          if [ "$actual_repo" != "$expected_repo" ] \
              || [ "$actual_repo" != "$EXPECTED_HEAD_REPO" ] \
              || [ "$actual_ref" != "$EXPECTED_HEAD_REF" ] \
              || [ "$actual_sha" != "$EXPECTED_HEAD_SHA" ] \
              || [ "$actual_author" != "$publisher" ] \
              || [[ "$actual_ref" != agent-assist/* ]] \
              || [ "$has_job_marker" != "true" ]; then
            echo "::error::PR is not a verified X Engineering Agent publication target."
            exit 1
          fi
          if [ -n "$DISPATCHED_HEAD_SHA" ] \
              && [ "$actual_sha" != "$DISPATCHED_HEAD_SHA" ]; then
            echo "::error::PR head changed after live-test dispatch."
            exit 1
          fi
          {
            echo "publisher=${publisher}"
            echo "head_repo=${actual_repo}"
            echo "head_ref=${actual_ref}"
            echo "head_sha=${actual_sha}"
          } >> "$GITHUB_OUTPUT"
          gh api --paginate --slurp \
            "repos/${PR_REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            > "$RUNNER_TEMP/pr-files.json"

      - name: Download live-test artifact
        uses: actions/download-artifact@v4
        with:
          name: live-test-pr-${{ inputs.pr_number }}
          path: artifact

      - name: Checkout exact agent PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.verify.outputs.head_repo }}
          ref: ${{ steps.verify.outputs.head_sha }}
          token: ${{ steps.kv.outputs.publish_token }}
          persist-credentials: false
          fetch-depth: 0
          path: pr-head

      - name: Validate and stage recording files
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import shutil
          import json

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          source = (workspace / "artifact" / "recordings").resolve()
          target = (workspace / "pr-head").resolve()
          if not source.is_dir():
              raise SystemExit("Recording artifact directory is missing")

          pages = json.loads(
              (pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr-files.json")
              .read_text(encoding="utf-8")
          )
          changed_files = [
              item
              for page in pages
              for item in page
              if isinstance(item, dict)
          ]
          allowed_directories = {
              pathlib.PurePosixPath(item["filename"]).parent / "recordings"
              for item in changed_files
              if (
                  item.get("status") != "removed"
                  and isinstance(item.get("filename"), str)
                  and "tests" in pathlib.PurePosixPath(item["filename"]).parts
                  and pathlib.PurePosixPath(item["filename"]).name.startswith("test_")
                  and pathlib.PurePosixPath(item["filename"]).suffix == ".py"
              )
          }
          if not allowed_directories:
              raise SystemExit("PR has no changed test-file recording directories")

          files = []
          total_size = 0
          for path in source.rglob("*"):
              if path.is_symlink():
                  raise SystemExit(f"Recording artifact contains a symlink: {path}")
              if not path.is_file():
                  continue
              relative = path.relative_to(source)
              parts = relative.parts
              if (
                  "tests" not in parts
                  or "recordings" not in parts
                  or parts.index("tests") >= parts.index("recordings")
                  or path.suffix != ".yaml"
                  or any(ord(char) < 32 for char in relative.as_posix())
                  or relative.parent not in allowed_directories
              ):
                  raise SystemExit(f"Invalid recording artifact path: {relative}")
              size = path.stat().st_size
              if size > 4 * 1024 * 1024:
                  raise SystemExit(f"Recording artifact file is too large: {relative}")
              path.read_text(encoding="utf-8")
              total_size += size
              files.append(relative)

          if not files or len(files) > 100 or total_size > 20 * 1024 * 1024:
              raise SystemExit("Recording artifact count or total size is invalid")

          manifest = workspace / "recording-files.txt"
          with manifest.open("w", encoding="utf-8") as output:
              for relative in sorted(files):
                  destination = (target / relative).resolve()
                  if target not in destination.parents:
                      raise SystemExit(f"Recording path escapes checkout: {relative}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source / relative, destination)
                  output.write(f"{relative.as_posix()}\n")
          PY
          cd pr-head
          git add --pathspec-from-file="$GITHUB_WORKSPACE/recording-files.txt"
          git diff --cached --name-only > "$RUNNER_TEMP/staged-files.txt"
          diff -u "$GITHUB_WORKSPACE/recording-files.txt" "$RUNNER_TEMP/staged-files.txt"

      - name: Commit and push recordings
        id: push
        env:
          GH_TOKEN: ${{ steps.kv.outputs.publish_token }}
          HEAD_REPO: ${{ steps.verify.outputs.head_repo }}
          HEAD_REF: ${{ steps.verify.outputs.head_ref }}
          HEAD_SHA: ${{ steps.verify.outputs.head_sha }}
          PUBLISHER: ${{ steps.verify.outputs.publisher }}
          PUBLISH_TOKEN: ${{ steps.kv.outputs.publish_token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          current_pr_sha=$(gh api "repos/${PR_REPO}/pulls/${PR_NUMBER}" --jq .head.sha)
          current_ref_sha=$(gh api \
            "repos/${HEAD_REPO}/git/ref/heads/${HEAD_REF}" --jq .object.sha)
          if [ "$current_pr_sha" != "$HEAD_SHA" ] \
              || [ "$current_ref_sha" != "$HEAD_SHA" ]; then
            echo "::error::Agent branch moved after recording verification."
            exit 1
          fi
          cd pr-head
          if git diff --cached --quiet; then
            echo "::error::Validated recording artifact produced no commit."
            exit 1
          fi
          git config user.name "X Engineering Agent"
          git config user.email "59631311+a0x1ab@users.noreply.github.com"
          git commit -m "Update live-test recordings from azdev --live" \
            -m "Regenerated and playback-verified by X Engineering Agent. Run: ${RUN_URL}" >/dev/null
          commit_sha=$(git rev-parse HEAD)
          git remote set-url origin \
            "https://x-access-token:${PUBLISH_TOKEN}@github.com/${HEAD_REPO}.git"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"

      - name: Report automatic recording publication
        env:
          GH_TOKEN: ${{ steps.kv.outputs.bot_token }}
          COMMIT_SHA: ${{ steps.push.outputs.commit_sha }}
          HEAD_REF: ${{ steps.verify.outputs.head_ref }}
        run: |
          set -euo pipefail
          body=$(printf '%s\n\n%s\n\n%s' \
            '## Live-test recordings published' \
            "✅ X Engineering Agent committed the regenerated, playback-verified recordings to \`${HEAD_REF}\` as \`${COMMIT_SHA}\`." \
            "**Workflow run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          gh api -X POST \
            "repos/${PR_REPO}/issues/${PR_NUMBER}/comments" \
            -f body="$body" >/dev/null
