name: Live Test (Azure CLI PR)
run-name: Live Test (PR ${{ inputs.pr_number }} @ ${{ inputs.pr_head_sha || 'auto' }})

# Triggered remotely by the agent-assist Tester agent via:
#   POST /repos/Azure/issue-sentinel/actions/workflows/live-test.yml/dispatches
#
# Runs `azdev test {module} --live --series` against an in-flight PR on
# Azure/azure-cli using BAMI-tenant credentials (federated via OIDC), and
# posts the result back as a PR comment.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number on Azure/azure-cli"
        required: true
        type: string
      module:
        description: "azdev module or extension name to test (e.g. acs, costmanagement). Leave blank to auto-detect from changed files."
        required: false
        type: string
        default: ""
      target_kind:
        description: "Whether `module` names a core module or an azure-cli-extensions extension."
        required: false
        type: choice
        options:
          - module
          - extension
        default: module
      repo:
        description: "owner/repo of the PR (Azure/azure-cli or Azure/azure-cli-extensions)"
        required: false
        type: string
        default: "Azure/azure-cli"
      pr_head_sha:
        description: "PR head SHA observed by dispatcher (optional, for dedupe/traceability)"
        required: false
        type: string
        default: ""
      post_comment:
        description: "Post result back to the PR as a comment"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write       # required for federated OIDC login to BAMI
  contents: read
  pull-requests: write  # required to comment back on the PR

concurrency:
  group: live-test-${{ inputs.repo }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  live-test:
    name: azdev test --live (PR ${{ inputs.pr_number }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PR_REPO: ${{ inputs.repo }}
      PR_NUMBER: ${{ inputs.pr_number }}
      MODULE_INPUT: ${{ inputs.module }}
      TARGET_KIND_INPUT: ${{ inputs.target_kind }}

    steps:
      - name: Azure login (SDK Infrastructure, federated OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURESDK_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURESDK_TENANT_ID }}
          subscription-id: ${{ secrets.AZURESDK_SUBSCRIPTION_ID }}

      - name: Fetch PAT from Key Vault
        id: kv
        run: |
          set -euo pipefail
          pat=$(az keyvault secret show \
            --vault-name kv-azuresdk \
            --name azclibot-pat \
            --query value -o tsv)
          echo "::add-mask::${pat}"
          echo "pat=${pat}" >> "$GITHUB_OUTPUT"

      - name: Azure login (BAMI tenant, federated OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.BAMI_CLIENT_ID }}
          tenant-id:       ${{ secrets.BAMI_TENANT_ID }}
          subscription-id: ${{ secrets.BAMI_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false

      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ steps.kv.outputs.pat }}
        run: |
          set -euo pipefail
          owner="${PR_REPO%/*}"
          repo="${PR_REPO#*/}"
          pr_json=$(gh api "repos/${owner}/${repo}/pulls/${PR_NUMBER}")
          head_sha=$(echo "$pr_json" | jq -r .head.sha)
          head_ref=$(echo "$pr_json" | jq -r .head.ref)
          base_ref=$(echo "$pr_json" | jq -r .base.ref)
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${head_ref}" >> "$GITHUB_OUTPUT"
          echo "base_ref=${base_ref}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}"       >> "$GITHUB_OUTPUT"
          echo "repo=${repo}"         >> "$GITHUB_OUTPUT"

      - name: Log resolved PR refs
        run: |
          set -euo pipefail
          echo "Resolved PR target: ${{ steps.pr.outputs.owner }}/${{ steps.pr.outputs.repo }}#${{ inputs.pr_number }}"
          echo "PR head ref: ${{ steps.pr.outputs.head_ref }}"
          echo "PR head sha: ${{ steps.pr.outputs.head_sha }}"
          echo "PR base ref: ${{ steps.pr.outputs.base_ref }}"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.owner }}/${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          path: ${{ steps.pr.outputs.repo }}

      - name: Checkout companion repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repo == 'azure-cli' && 'Azure/azure-cli-extensions' || 'Azure/azure-cli' }}
          ref: ${{ steps.pr.outputs.repo == 'azure-cli' && 'main' || 'dev' }}
          fetch-depth: 1
          path: ${{ steps.pr.outputs.repo == 'azure-cli' && 'azure-cli-extensions' || 'azure-cli' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve target (module or extension)
        id: detect
        env:
          PR_REPO_NAME: ${{ steps.pr.outputs.repo }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          name="${MODULE_INPUT}"
          if [ "$PR_REPO_NAME" = "azure-cli-extensions" ]; then
            kind="extension"
          else
            kind="${TARGET_KIND_INPUT:-module}"
          fi
          if [ -z "${name}" ]; then
            cd "$PR_REPO_NAME"
            git fetch origin "${BASE_REF}" --depth=200 || true
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            if [ "$PR_REPO_NAME" = "azure-cli-extensions" ]; then
              name=$(echo "$changed" | awk -F/ '$1=="src" {print $2}' | sort | uniq -c | sort -rn | awk 'NR==1 {print $2}')
            else
              name=$(echo "$changed" | awk -F/ '/command_modules/ {print $5}' | sort | uniq -c | sort -rn | awk 'NR==1 {print $2}')
            fi
            cd ..
          fi
          if [ -z "$name" ]; then
            echo "::error::Could not resolve target name from inputs or changed files"
            exit 1
          fi
          mod_dir="azure-cli/src/azure-cli/azure/cli/command_modules/${name}"
          ext_dir="azure-cli-extensions/src/${name}"
          if [ "$kind" = "module" ] && [ ! -d "$mod_dir" ] && [ -d "$ext_dir" ]; then
            echo "Switching kind: '$name' is an extension, not a core module"
            kind="extension"
          elif [ "$kind" = "extension" ] && [ ! -d "$ext_dir" ] && [ -d "$mod_dir" ]; then
            echo "Switching kind: '$name' is a core module, not an extension"
            kind="module"
          fi
          if [ "$kind" = "module" ] && [ ! -d "$mod_dir" ]; then
            echo "::error::Unknown core module '$name' (no $mod_dir and no $ext_dir)"
            exit 1
          fi
          if [ "$kind" = "extension" ] && [ ! -d "$ext_dir" ]; then
            echo "::error::Unknown extension '$name' (no $ext_dir and no $mod_dir)"
            exit 1
          fi
          echo "module=${name}" >> "$GITHUB_OUTPUT"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"
          echo "Resolved target: ${name} (${kind})"

      - name: Detect new live tests in PR
        id: newtests
        env:
          PR_REPO_NAME: ${{ steps.pr.outputs.repo }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          KIND: ${{ steps.detect.outputs.kind }}
          NAME: ${{ steps.detect.outputs.module }}
        run: |
          set -euo pipefail
          cd "$PR_REPO_NAME"
          if [ "$KIND" = "extension" ]; then
            new_tests=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" \
              -- "src/${NAME}/**/tests/*" || true)
          else
            new_tests=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" \
              -- 'src/azure-cli/azure/cli/command_modules/*/tests/*' || true)
          fi
          if [ -n "$new_tests" ]; then
            echo "has_new_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new_tests=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "list<<EOF"
            echo "$new_tests"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install azdev and Azure CLI from source
        env:
          KIND: ${{ steps.detect.outputs.kind }}
          NAME: ${{ steps.detect.outputs.module }}
        run: |
          set -euo pipefail
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install azdev
          if [ "$KIND" = "extension" ]; then
            azdev setup -c azure-cli -r azure-cli-extensions -e "$NAME"
          else
            azdev setup -c azure-cli
          fi

      - name: Run azdev test (live, series)
        id: test
        env:
          MODULE: ${{ steps.detect.outputs.module }}
          KIND: ${{ steps.detect.outputs.kind }}
        run: |
          source .venv/bin/activate
          set -o pipefail
          mkdir -p test-output
          set +e
          azdev test "$MODULE" --live --series \
            --xml-path test-output/results.xml \
            2>&1 | tee test-output/log.txt
          rc=$?
          set -e
          ran=true
          if [ ! -s test-output/results.xml ] || ! grep -q '<testcase' test-output/results.xml; then
            ran=false
            if [ "$rc" = "0" ]; then
              echo "::error::azdev test '$MODULE' (${KIND}) selected 0 tests — target name is likely wrong."
              rc=2
            fi
          fi
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          echo "ran_tests=${ran}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-pr-${{ inputs.pr_number }}-${{ steps.detect.outputs.module }}
          path: test-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Build PR comment body
        if: always() && inputs.post_comment == true
        id: body
        env:
          MODULE: ${{ steps.detect.outputs.module }}
          KIND: ${{ steps.detect.outputs.kind }}
          EXIT_CODE: ${{ steps.test.outputs.exit_code }}
          RAN_TESTS: ${{ steps.test.outputs.ran_tests }}
          NEW_TESTS: ${{ steps.newtests.outputs.has_new_tests }}
          NEW_TESTS_LIST: ${{ steps.newtests.outputs.list }}
          PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${EXIT_CODE}" = "0" ]; then
            status="✅ **PASS**"
          elif [ "${RAN_TESTS}" = "false" ]; then
            status="❌ **FAIL** — no tests selected for \`${MODULE}\` (${KIND})"
          else
            status="❌ **FAIL** (exit ${EXIT_CODE})"
          fi
          tail_log=$(tail -n 80 test-output/log.txt 2>/dev/null || echo "(no log captured)")
          {
            echo "## Live test results — \`azdev test ${MODULE} --live --series\`"
            echo
            echo "${status}"
            echo
            echo "**Target:** \`${MODULE}\` (${KIND})"
            echo "**PR head ref:** \`${PR_HEAD_REF}\`"
            echo "**PR head sha:** \`${PR_HEAD_SHA}\`"
            echo "**PR base ref:** \`${PR_BASE_REF}\`"
            echo "**New test files in PR:** ${NEW_TESTS}"
            if [ "${NEW_TESTS}" = "true" ]; then
              echo
              echo "<details><summary>New test files</summary>"
              echo
              echo '```'
              echo "${NEW_TESTS_LIST}"
              echo '```'
              echo
              echo "</details>"
            fi
            echo
            echo "**Workflow run:** ${RUN_URL}"
            echo
            echo "<details><summary>Last 80 lines of azdev output</summary>"
            echo
            echo '```'
            echo "${tail_log}"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "_Posted by [agent-assist](https://github.com/Azure/issue-sentinel/blob/main/.github/workflows/live-test.yml) live-test workflow._"
          } > comment.md
          echo "path=comment.md" >> "$GITHUB_OUTPUT"

      - name: Post comment back to PR
        if: always() && inputs.post_comment == true
        env:
          GH_TOKEN: ${{ steps.kv.outputs.pat }}
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${PR_REPO}/issues/${PR_NUMBER}/comments" \
            -F body=@${{ steps.body.outputs.path }} >/dev/null
          echo "Comment posted to ${PR_REPO}#${PR_NUMBER}"

      - name: Set workflow conclusion
        if: always()
        env:
          EXIT_CODE: ${{ steps.test.outputs.exit_code }}
        run: |
          if [ "${EXIT_CODE}" = "0" ]; then
            echo "azdev tests passed."
            exit 0
          else
            echo "azdev tests failed (exit ${EXIT_CODE})."
            exit 1
          fi
