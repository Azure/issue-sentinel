name: Live Repro Tests

# Unit tests for the live reproduction workflows and runners; no Azure login or secrets.

on:
  pull_request:
    paths:
      - ".github/workflows/live-repro*.yml"
      - ".github/scripts/live_repro/**"
      - "tests/live_repro/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live-repro*.yml"
      - ".github/scripts/live_repro/**"
      - "tests/live_repro/**"

permissions:
  contents: read

jobs:
  test:
    name: pytest tests/live_repro
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r tests/live_repro/requirements.txt

      - name: Run tests
        run: python -m pytest -q tests/live_repro
