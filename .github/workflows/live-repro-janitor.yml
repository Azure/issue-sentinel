name: Live Repro Janitor

# Deletes xea-repro-* resource groups whose expiresAt tag has passed or is missing.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List expired groups without deleting them"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: live-repro-janitor
  cancel-in-progress: false

jobs:
  janitor:
    name: Delete expired reproduction resource groups
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted runner scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: sentinel
          persist-credentials: false
          sparse-checkout: .github/scripts/live_repro

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Azure login (BAMI tenant, federated OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id:       ${{ secrets.BAMI_CLIENT_ID }}
          tenant-id:       ${{ secrets.BAMI_TENANT_ID }}
          subscription-id: ${{ secrets.BAMI_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false

      - name: Delete expired groups (output to files)
        env:
          REPRO_JANITOR_DRY_RUN: ${{ inputs.dry_run }}
        run: python3 sentinel/.github/scripts/live_repro/repro_janitor.py

      - name: Sign out of Azure
        if: always()
        run: python3 sentinel/.github/scripts/live_repro/repro_runner.py logout
