name: Live Repro (Azure CLI)
run-name: Live Repro (${{ inputs.issue }} @ ${{ inputs.spec_hash }}${{ inputs.pr_number != '' && format(' PR {0} head {1}', inputs.pr_number, inputs.pr_head_sha) || '' }})

# Versioned template: the source of truth lives in x-engineering-agent under
# deploy/issue-sentinel/ (see its README for how to sync it here).
#
# Dispatched by the X Engineering Agent (`dispatch_reproduction`, plan item
# C2b/C2c) via:
#   POST /repos/Azure/issue-sentinel/actions/workflows/live-repro.yml/dispatches
#
# Runs a validated ReproSpec (argv-only Azure CLI steps derived from an issue)
# against the reported, latest and dev CLI in a throwaway resource group in
# the BAMI live-test subscription. This repository is PUBLIC and the commands
# come from issue text, so unlike live-test.yml:
#   - no Key Vault / GitHub PAT step: nothing is written back to GitHub;
#   - permissions are id-token: write + contents: read only;
#   - the trusted runner re-validates the spec and its hash before anything
#     runs, and executes steps as argv lists without a shell;
#   - ALL command output is redirected to files on the runner; the log shows
#     only exit codes and verdicts;
#   - a sanitize step (no Azure credentials) redacts with the rules of
#     x_engineering_agent.security.sensitive_data and only
#     repro.redacted.json is uploaded;
#   - the per-run resource group is tagged with expiresAt and always deleted;
#     live-repro-janitor.yml removes anything left behind.
#
# PR-head re-runs (pr_number + pr_head_sha, plan item C2f) re-run the SAME
# verified spec on dev (before) and on the PR head (after). Trust model: the
# PR is authored by the X Engineering Agent on the Agent's own fork, the same
# party whose specs this workflow already runs. The prepare job only accepts
# an open PR against the spec's repository whose head repository is the Agent
# fork configured in REPO_PROFILES and whose head commit equals pr_head_sha
# (40 hex). The build-pr job checks out exactly that commit
# (persist-credentials: false) and builds wheels with contents: read only:
# no secrets, no id-token. The reproduce job only installs those wheels
# (no PR code runs) and executes the PR's CLI solely in the "Run ReproSpec"
# step, the sandbox designed to run the CLI with the BAMI login.
# Never interpolate ${{ inputs.* }} into run: scripts; pass values via env.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue the spec reproduces (Azure/<repo>#<number>)"
        required: true
        type: string
      spec:
        description: "Canonical ReproSpec JSON (validated again by the runner)"
        required: true
        type: string
      spec_hash:
        description: "SHA-256 of the spec input; the run refuses any mismatch"
        required: true
        type: string
      pr_number:
        description: "Optional PR number: re-run the spec on dev (before) and the PR head (after)"
        required: false
        type: string
        default: ""
      pr_head_sha:
        description: "PR head commit (40 hex) to re-run; required with pr_number"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: live-repro-${{ inputs.issue }}-${{ inputs.spec_hash }}-${{ inputs.pr_number }}-${{ inputs.pr_head_sha }}
  cancel-in-progress: false

env:
  REPRO_ISSUE: ${{ inputs.issue }}
  REPRO_SPEC: ${{ inputs.spec }}
  REPRO_SPEC_HASH: ${{ inputs.spec_hash }}
  REPRO_PR_NUMBER: ${{ inputs.pr_number }}
  REPRO_PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
  RUNNER_SCRIPTS: sentinel/.github/scripts/live_repro

jobs:
  prepare:
    name: Verify ReproSpec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.verify.outputs.versions }}
      step_timeout_minutes: ${{ steps.verify.outputs.step_timeout_minutes }}
      source_repo: ${{ steps.verify.outputs.source_repo }}
      dev_ref: ${{ steps.verify.outputs.dev_ref }}
      pr_repo: ${{ steps.verify.outputs.pr_repo }}
      pr_ref: ${{ steps.verify.outputs.pr_ref }}
    steps:
      - name: Checkout trusted runner scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: sentinel
          persist-credentials: false
          sparse-checkout: .github/scripts/live_repro

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Re-validate spec against spec_hash (and the Agent PR head)
        id: verify
        env:
          REPRO_GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_SCRIPTS/repro_runner.py" verify

  build-pr:
    name: Build PR head wheels (no Azure credentials)
    needs: prepare
    if: inputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout trusted runner scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: sentinel
          persist-credentials: false
          sparse-checkout: .github/scripts/live_repro

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Checkout the verified PR head (Agent fork)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.prepare.outputs.pr_repo }}
          ref: ${{ needs.prepare.outputs.pr_ref }}
          path: repro/src
          fetch-depth: 1
          persist-credentials: false

      - name: Build wheels (output to files)
        timeout-minutes: 25
        run: python3 "$RUNNER_SCRIPTS/repro_runner.py" build

      - name: Upload PR head wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repro-pr-wheels
          path: repro/wheels/
          if-no-files-found: error
          retention-days: 1

  reproduce:
    name: Reproduce (${{ matrix.version }})
    needs: [prepare, build-pr]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write   # federated OIDC login to BAMI
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    env:
      REPRO_VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout trusted runner scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: sentinel
          persist-credentials: false
          sparse-checkout: .github/scripts/live_repro

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Checkout CLI source (dev)
        if: matrix.version == 'dev'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.prepare.outputs.source_repo }}
          ref: ${{ needs.prepare.outputs.dev_ref }}
          path: repro/src
          fetch-depth: 1
          persist-credentials: false

      - name: Download PR head wheels (built without credentials)
        if: matrix.version == 'pr'
        continue-on-error: true   # install records the failure as the result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: repro-pr-wheels
          path: repro/wheels

      - name: Install CLI version (output to files)
        timeout-minutes: 30
        run: python3 "$RUNNER_SCRIPTS/repro_runner.py" install

      - name: Azure login (BAMI tenant, federated OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id:       ${{ secrets.BAMI_CLIENT_ID }}
          tenant-id:       ${{ secrets.BAMI_TENANT_ID }}
          subscription-id: ${{ secrets.BAMI_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false

      - name: Create per-run resource group (expiresAt tag)
        timeout-minutes: 10
        run: python3 "$RUNNER_SCRIPTS/repro_runner.py" rg-create

      - name: Run ReproSpec steps (argv, no shell, output to files)
        timeout-minutes: ${{ fromJSON(needs.prepare.outputs.step_timeout_minutes) }}
        env:
          REPRO_SUBSCRIPTION_ID: ${{ secrets.BAMI_SUBSCRIPTION_ID }}
        run: python3 "$RUNNER_SCRIPTS/repro_runner.py" run

      - name: Delete per-run resource group
        if: always()
        timeout-minutes: 25
        run: python3 "$RUNNER_SCRIPTS/repro_runner.py" rg-delete

      - name: Sign out of Azure
        if: always()
        timeout-minutes: 5
        run: python3 "$RUNNER_SCRIPTS/repro_runner.py" logout

      - name: Sanitize output (no Azure credentials)
        if: always()
        timeout-minutes: 5
        env:
          REPRO_SUBSCRIPTION_ID: ${{ secrets.BAMI_SUBSCRIPTION_ID }}
          REPRO_TENANT_ID: ${{ secrets.BAMI_TENANT_ID }}
          REPRO_CLIENT_ID: ${{ secrets.BAMI_CLIENT_ID }}
        run: python3 "$RUNNER_SCRIPTS/repro_sanitize.py" version

      - name: Upload redacted result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repro-redacted-${{ matrix.version }}
          path: repro/out/repro.redacted.json
          if-no-files-found: error
          retention-days: 14

  report:
    name: Merge redacted results
    needs: [prepare, reproduce]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted runner scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: sentinel
          persist-credentials: false
          sparse-checkout: .github/scripts/live_repro

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download per-version results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: repro-redacted-*
          path: parts

      - name: Merge and re-sanitize
        run: python3 "$RUNNER_SCRIPTS/repro_sanitize.py" merge --parts parts --out result/repro.redacted.json

      - name: Upload repro.redacted.json
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repro-redacted
          path: result/repro.redacted.json
          if-no-files-found: error
          retention-days: 14
