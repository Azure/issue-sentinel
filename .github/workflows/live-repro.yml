name: Live Repro (Azure CLI)
run-name: Live Repro (${{ inputs.issue }} @ ${{ inputs.spec_hash }}${{ inputs.pr_number != '' && format(' PR {0} head {1}', inputs.pr_number, inputs.pr_head_sha) || '' }})

# Reproduces Azure CLI issues for the X Engineering Agent in a throwaway BAMI resource group.
# Steps come from public issue text; read .github/scripts/live_repro/README.md before changing this.
# PR-head re-runs only accept an open PR from the Agent's own fork whose head is pr_head_sha,
# or with pr_number 0 the Agent fork branch xea-candidate/<pr_head_sha> pointing at pr_head_sha.
# build-pr checks it out with persist-credentials: false and builds wheels with no secrets, no id-token;
# the reproduce job only installs those wheels and runs the PR's CLI in "Run ReproSpec".
# Never interpolate ${{ inputs.* }} into run: scripts; pass values via env.
# Specs with "azure": false (shell scripts, any OS) run in reproduce-local, which has no
# id-token permission, no secrets and never signs in, so scripts can't reach Azure credentials.
# A spec's "environment" picks a runner image or a distro container (env-up and env-down in the
# reproduce jobs), or a Windows VM in reproduce-vm. VM specs are always "azure": false: the job
# signs in only to create the VM in the per-run group and drive it with Run Command; the VM has
# no identity and never signs in.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue the spec reproduces (Azure/<repo>#<number>)"
        required: true
        type: string
      spec:
        description: "Canonical ReproSpec JSON (validated again by the runner)"
        required: true
        type: string
      spec_hash:
        description: "SHA-256 of the spec input; the run refuses any mismatch"
        required: true
        type: string
      pr_number:
        description: "Optional PR number (0 for an Agent candidate branch): re-run the spec on dev (before) and the head (after)"
        required: false
        type: string
        default: ""
      pr_head_sha:
        description: "PR head commit (40 hex) to re-run; required with pr_number"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: live-repro-${{ inputs.issue }}-${{ inputs.spec_hash }}-${{ inputs.pr_number }}-${{ inputs.pr_head_sha }}
  cancel-in-progress: false

env:
  REPRO_ISSUE: ${{ inputs.issue }}
  REPRO_SPEC: ${{ inputs.spec }}
  REPRO_SPEC_HASH: ${{ inputs.spec_hash }}
  REPRO_PR_NUMBER: ${{ inputs.pr_number }}
  REPRO_PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
  RUNNER_SCRIPTS: sentinel/.github/scripts/live_repro

jobs:
  prepare:
    name: Verify ReproSpec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.verify.outputs.versions }}
      runs_on: ${{ steps.verify.outputs.runs_on }}
      azure: ${{ steps.verify.outputs.azure }}
      isolation: ${{ steps.verify.outputs.isolation }}
      step_timeout_minutes: ${{ steps.verify.outputs.step_timeout_minutes }}
      source_repo: ${{ steps.verify.outputs.source_repo }}
      dev_ref: ${{ steps.verify.outputs.dev_ref }}
      pr_repo: ${{ steps.verify.outputs.pr_repo }}
      pr_ref: ${{ steps.verify.outputs.pr_ref }}
    steps:
      - name: Checkout trusted runner scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: sentinel
          persist-credentials: false
          sparse-checkout: .github/scripts/live_repro

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Re-validate spec against spec_hash (and the Agent PR head)
        id: verify
        env:
          REPRO_GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_SCRIPTS/repro_runner.py" verify

  build-pr:
    name: Build PR head wheels (no Azure credentials)
    needs: prepare
    if: inputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout trusted runner scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: sentinel
          persist-credentials: false
          sparse-checkout: .github/scripts/live_repro

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Checkout the verified PR head (Agent fork)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.pr_repo }}
          ref: ${{ needs.prepare.outputs.pr_ref }}
          path: repro/src
          fetch-depth: 1
          persist-credentials: false

      - name: Build wheels (output to files)
        timeout-minutes: 25
        run: python3 "$RUNNER_SCRIPTS/repro_runner.py" build

      - name: Upload PR head wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-pr-wheels
          path: repro/wheels/
          if-no-files-found: error
          retention-days: 1

  reproduce:
    name: Reproduce (${{ matrix.version }})
    needs: [prepare, build-pr]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.azure == 'true'
    runs-on: ${{ needs.prepare.outputs.runs_on }}
    timeout-minutes: 200
    defaults:
      run:
        shell: bash
    permissions:
      id-token: write   # federated OIDC login to BAMI
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    env:
      REPRO_VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout trusted runner scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: sentinel
          persist-credentials: false
          sparse-checkout: .github/scripts/live_repro

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare the host (long git paths on Windows)
        run: python "$RUNNER_SCRIPTS/repro_runner.py" host-setup

      - name: Checkout CLI source (dev)
        if: matrix.version == 'dev'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source_repo }}
          ref: ${{ needs.prepare.outputs.dev_ref }}
          path: repro/src
          fetch-depth: 1
          persist-credentials: false

      - name: Download PR head wheels (built without credentials)
        if: matrix.version == 'pr'
        continue-on-error: true   # install records the failure as the result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-pr-wheels
          path: repro/wheels

      - name: Start the repro environment (distro container, if any)
        timeout-minutes: 20
        run: python "$RUNNER_SCRIPTS/repro_runner.py" env-up

      - name: Install CLI version (output to files)
        id: install
        timeout-minutes: 30
        run: python "$RUNNER_SCRIPTS/repro_runner.py" install

      - name: Azure login (BAMI tenant, federated OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id:       ${{ secrets.BAMI_CLIENT_ID }}
          tenant-id:       ${{ secrets.BAMI_TENANT_ID }}
          subscription-id: ${{ secrets.BAMI_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false

      - name: Create per-run resource group (expiresAt tag)
        timeout-minutes: 10
        run: python "$RUNNER_SCRIPTS/repro_runner.py" rg-create

      - name: Run ReproSpec steps (argv, no shell, output to files)
        timeout-minutes: ${{ fromJSON(needs.prepare.outputs.step_timeout_minutes) }}
        env:
          REPRO_SUBSCRIPTION_ID: ${{ secrets.BAMI_SUBSCRIPTION_ID }}
        run: python "$RUNNER_SCRIPTS/repro_runner.py" run

      - name: Stop the repro environment
        if: always()
        timeout-minutes: 5
        run: python "$RUNNER_SCRIPTS/repro_runner.py" env-down

      - name: Delete per-run resource group
        if: always()
        timeout-minutes: 25
        run: python "$RUNNER_SCRIPTS/repro_runner.py" rg-delete

      - name: Sign out of Azure
        if: always()
        timeout-minutes: 5
        run: python "$RUNNER_SCRIPTS/repro_runner.py" logout

      - name: Sanitize output (no Azure credentials)
        if: always()
        timeout-minutes: 5
        env:
          REPRO_SUBSCRIPTION_ID: ${{ secrets.BAMI_SUBSCRIPTION_ID }}
          REPRO_TENANT_ID: ${{ secrets.BAMI_TENANT_ID }}
          REPRO_CLIENT_ID: ${{ secrets.BAMI_CLIENT_ID }}
        run: python "$RUNNER_SCRIPTS/repro_sanitize.py" version

      - name: Upload redacted result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-redacted-${{ matrix.version }}
          path: repro/out/repro.redacted.json
          if-no-files-found: error
          retention-days: 14

  reproduce-local:
    name: Reproduce without Azure (${{ matrix.version }})
    needs: [prepare, build-pr]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.azure == 'false' && needs.prepare.outputs.isolation != 'vm'
    runs-on: ${{ needs.prepare.outputs.runs_on }}
    timeout-minutes: 200
    defaults:
      run:
        shell: bash
    permissions:
      contents: read   # no id-token and no secrets: scripts never reach Azure credentials
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    env:
      REPRO_VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout trusted runner scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: sentinel
          persist-credentials: false
          sparse-checkout: .github/scripts/live_repro

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare the host (long git paths on Windows)
        run: python "$RUNNER_SCRIPTS/repro_runner.py" host-setup

      - name: Checkout CLI source (dev)
        if: matrix.version == 'dev'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source_repo }}
          ref: ${{ needs.prepare.outputs.dev_ref }}
          path: repro/src
          fetch-depth: 1
          persist-credentials: false

      - name: Download PR head wheels (built without credentials)
        if: matrix.version == 'pr'
        continue-on-error: true   # install records the failure as the result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-pr-wheels
          path: repro/wheels

      - name: Start the repro environment (distro container, if any)
        timeout-minutes: 20
        run: python "$RUNNER_SCRIPTS/repro_runner.py" env-up

      - name: Install CLI version (output to files)
        id: install
        timeout-minutes: 30
        run: python "$RUNNER_SCRIPTS/repro_runner.py" install

      - name: Checkout the matching source for scripts (REPRO_SOURCE_DIR)
        if: matrix.version != 'dev' && steps.install.outputs.source_ref != ''
        continue-on-error: true   # scripts that need it fail visibly in the result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.version == 'pr' && needs.prepare.outputs.pr_repo || needs.prepare.outputs.source_repo }}
          ref: ${{ steps.install.outputs.source_ref }}
          path: repro/src
          fetch-depth: 1
          persist-credentials: false

      - name: Run ReproSpec steps (no Azure sign in, output to files)
        timeout-minutes: ${{ fromJSON(needs.prepare.outputs.step_timeout_minutes) }}
        run: python "$RUNNER_SCRIPTS/repro_runner.py" run

      - name: Stop the repro environment
        if: always()
        timeout-minutes: 5
        run: python "$RUNNER_SCRIPTS/repro_runner.py" env-down

      - name: Sanitize output
        if: always()
        timeout-minutes: 5
        run: python "$RUNNER_SCRIPTS/repro_sanitize.py" version

      - name: Upload redacted result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-redacted-${{ matrix.version }}
          path: repro/out/repro.redacted.json
          if-no-files-found: error
          retention-days: 14

  reproduce-vm:
    name: Reproduce in a Windows VM (${{ matrix.version }})
    needs: [prepare, build-pr]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.isolation == 'vm'
    runs-on: ${{ needs.prepare.outputs.runs_on }}
    timeout-minutes: 200
    defaults:
      run:
        shell: bash
    permissions:
      id-token: write   # creates and drives the VM; the VM itself never signs in
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    env:
      REPRO_VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout trusted runner scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: sentinel
          persist-credentials: false
          sparse-checkout: .github/scripts/live_repro

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Azure login (BAMI tenant, federated OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id:       ${{ secrets.BAMI_CLIENT_ID }}
          tenant-id:       ${{ secrets.BAMI_TENANT_ID }}
          subscription-id: ${{ secrets.BAMI_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false

      - name: Create per-run resource group (expiresAt tag)
        timeout-minutes: 10
        run: python "$RUNNER_SCRIPTS/repro_runner.py" rg-create

      - name: Start the repro environment (Windows VM, no public IP or identity)
        timeout-minutes: 45
        run: python "$RUNNER_SCRIPTS/repro_runner.py" env-up

      - name: Install CLI version in the VM (output to files)
        timeout-minutes: 60
        run: python "$RUNNER_SCRIPTS/repro_runner.py" install

      - name: Run ReproSpec steps in the VM (Run Command, output to files)
        timeout-minutes: ${{ fromJSON(needs.prepare.outputs.step_timeout_minutes) }}
        run: python "$RUNNER_SCRIPTS/repro_runner.py" run

      - name: Delete per-run resource group
        if: always()
        timeout-minutes: 25
        run: python "$RUNNER_SCRIPTS/repro_runner.py" rg-delete

      - name: Sign out of Azure
        if: always()
        timeout-minutes: 5
        run: python "$RUNNER_SCRIPTS/repro_runner.py" logout

      - name: Sanitize output (no Azure credentials)
        if: always()
        timeout-minutes: 5
        env:
          REPRO_SUBSCRIPTION_ID: ${{ secrets.BAMI_SUBSCRIPTION_ID }}
          REPRO_TENANT_ID: ${{ secrets.BAMI_TENANT_ID }}
          REPRO_CLIENT_ID: ${{ secrets.BAMI_CLIENT_ID }}
        run: python "$RUNNER_SCRIPTS/repro_sanitize.py" version

      - name: Upload redacted result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repro-redacted-${{ matrix.version }}
          path: repro/out/repro.redacted.json
          if-no-files-found: error
          retention-days: 14

  report:
    name: Merge redacted results
    needs: [prepare, reproduce, reproduce-local, reproduce-vm]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted runner scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: sentinel
          persist-credentials: false
          sparse-checkout: .github/scripts/live_repro

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download per-version results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repro-redacted-*
          path: parts

      - name: Merge and re-sanitize
        run: python3 "$RUNNER_SCRIPTS/repro_sanitize.py" merge --parts parts --out result/repro.redacted.json

      - name: Upload repro.redacted.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-redacted
          path: result/repro.redacted.json
          if-no-files-found: error
          retention-days: 14
